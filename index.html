:root{
  /* 实验记录本：浅灰绿方格纸、藏青墨水、荧光笔黄做强调；单栏手机布局 */
  color-scheme: light;
  --paper:#e9f0ec; --card:#ffffff; --ink:#1d2b3a; --muted:#5f6d79; --line:#c5d1cc;
  --hl:#ffd84d; --red:#cf4038; --green:#2a8a66; --blue:#2c68c9;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
#app{max-width:460px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px;min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:40px;line-height:1.1}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:13px}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%)}
button{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
button:hover:not(:disabled){background:#f4f7f5}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:var(--hl);font-family:var(--display);font-size:19px;text-align:center;align-items:center;padding:13px}
button.primary:hover:not(:disabled){background:#ffcf24}
button.ghost{border-style:dashed;text-align:center;align-items:center}
button small{color:var(--muted);font-size:12px}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text]{font:inherit;padding:10px;border:1.5px solid var(--ink);border-radius:8px;width:100%;background:var(--card);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.top b{font-family:var(--display);font-weight:400;font-size:20px}
.money{font-variant-numeric:tabular-nums;font-weight:600}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.attr{display:grid;grid-template-columns:4.3em 1fr 2em;align-items:center;gap:6px;font-size:13px}
.attr i{display:block;height:7px;border-radius:4px;background:#dfe6e2;overflow:hidden}
.attr i u{display:block;height:100%;background:var(--ink)}
.attr.low i u,.attr.bad i u{background:var(--red)}
.attr.sci i u{background:var(--blue)}
.attr span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.dice{font-size:54px;line-height:1;text-align:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:rotate(-140deg) scale(.4)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.dice{animation:none}}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;border:1.5px solid var(--ink)}
.tag.good{background:#d6efe4;border-color:var(--green);color:#17573f}
.tag.bad{background:#f8dcd9;border-color:var(--red);color:#8a231d}
.tag.mid{background:#eef1f4}
.result{border-left:4px solid var(--hl);padding-left:10px;font-size:14px}
.ygrid{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;font-size:14px;margin:8px 0}
.ygrid em{font-style:normal;text-align:right;color:var(--muted,#667)}
.ygrid em.up{color:#1a7f4b}
.ygrid em.dn{color:var(--red)}
.log{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.log b{color:var(--ink);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(29,43,58,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow:auto;z-index:5}
.overlay .card{width:100%;max-width:440px;max-height:92%;overflow:auto;margin:auto 0}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stages span{font-size:12px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.stages span.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stages span.now{background:var(--hl);border-color:var(--ink);color:var(--ink)}
.paper{border:1.5px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
ul{margin:0;padding-left:1.2em}
.end h2{font-size:30px}
.sub{font-size:14px;border-top:1.5px dashed var(--line);padding-top:8px}
button.go{background:var(--hl)}
button.sel,button.sel:hover:not(:disabled){background:#fff3b0;box-shadow:inset 0 0 0 2px var(--ink);opacity:1}
.gobar{position:sticky;bottom:-14px;background:var(--card);padding:8px 0 4px;display:flex;flex-direction:column;gap:6px;border-top:1.5px dashed var(--line)}
button.go:hover:not(:disabled){background:#ffcf24}
.board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;aspect-ratio:1}
.tile{border:1.5px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px;position:relative;background:var(--card)}
.t-mentor{background:#f8dcd9}.t-peer{background:#dbe6fb}.t-research{background:#d6efe4}.t-life{background:#fff1b8}
.tile.here{color:transparent}
.pawn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;color:var(--ink);animation:hop .18s ease-out}
@keyframes hop{from{transform:translateY(-9px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.pawn{animation:none}}
.me{position:absolute;top:-9px;right:-7px;background:var(--ink);color:#fff;border-radius:99px;font:600 11px var(--body);padding:1px 5px;animation:pop .35s ease-out}
.mid{grid-row:2/6;grid-column:2/6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:4px 8px}
.mid .primary{width:100%}
.mid .dice{font-size:44px}
.bar{width:100%;height:8px;border-radius:4px;background:#dfe6e2;overflow:hidden}
.bar u{display:block;height:100%;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.legend .tile{width:22px;height:22px;font-size:13px;margin-right:3px;display:inline-flex}
.attrs.one{grid-template-columns:1fr}
.bar{display:block}
.strip{padding:0 2px}
.card.slim{padding:10px 14px}
.nm{font-family:var(--display);font-weight:400;font-size:17px}
button.mini{padding:4px 12px;font-size:13px;flex:none;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;background:var(--card)}
.chip b{font-variant-numeric:tabular-nums}
.chip.up{border-color:var(--green);background:#d6efe4;color:#17573f}
.chip.down{border-color:var(--red);background:#f8dcd9;color:#8a231d}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1.5px solid var(--ink);border-radius:10px;background:var(--card);padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.stat span{font-size:12.5px;color:var(--muted)}
.stat b{font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .bar u{background:var(--blue)}
.stat.bad .bar u{background:var(--red)}
button.opt{flex-direction:row;align-items:center;gap:10px}
button.opt>div{display:flex;flex-direction:column;gap:2px}
.badge{flex:none;width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px}
button small.cost{color:var(--red)}
.story{border-left:4px solid var(--red);background:#f1f5f3;padding:10px 12px;border-radius:0 8px 8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.big{font-family:var(--display);font-size:19px;align-items:center;text-align:center;padding:14px 8px;border-radius:99px}
button.big.roll,button.big.roll:hover:not(:disabled){background:var(--hl)}
button.big.day,button.big.day:hover:not(:disabled){background:var(--green);color:#fff}
.dicebar{display:flex;align-items:center;gap:12px;padding:0 2px}
.dicebar .dice{font-size:46px;flex:none}
.overlay .top h2{flex:1}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{gap:6px}
.mdate{font-size:12.5px;color:var(--muted)}
.mdate b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--ink)}
button.dicebtn{align-items:center;text-align:center;background:var(--hl);border-radius:16px;padding:8px 18px;gap:0}
button.dicebtn:hover:not(:disabled){background:#ffcf24}
button.dicebtn span{font-size:34px;line-height:1.15;letter-spacing:2px}
button.dicebtn small{font-size:12px;color:var(--ink)}
.res{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
button.daybtn{align-self:flex-end;flex-direction:row;background:var(--green);color:#fff;border-radius:99px;padding:6px 14px;font-size:14px;margin-top:auto}
button.daybtn:hover:not(:disabled){background:var(--green)}
.mid{justify-content:flex-start;padding:6px 8px 4px}
#app{gap:8px;padding-top:10px}
.card{padding:10px 12px;gap:8px}
.nav button{font-size:13px}
/* 立体按钮：能点的都有厚度，按下去会沉 */
button{box-shadow:0 4px 0 var(--ink);position:relative;top:0;transition:top .06s,box-shadow .06s}
button:active:not(:disabled){top:3px;box-shadow:0 1px 0 var(--ink)}
button:disabled{box-shadow:none;top:3px;border-style:dashed}
button.sel,button.sel:hover:not(:disabled){top:3px;box-shadow:inset 0 0 0 2px var(--ink);border-style:solid}

function resFactor(){const r=S.a.res;return r<30?1.5:(r>=70?0.5:1);}
const NASTY_F=0.75;
function gainProg(v){return Math.max(1,Math.round((v+Math.floor(S.a.ability/20))*(S.a.mood<30||S.a.health<30?0.5:1)*(S.mentor&&S.mentor.id==='nasty'?NASTY_F:1)));}
function applyEff(e,isEvent){
 const out=[];
 for(const k in e){
  let v=e[k];
  if(k==='money'){S.money=v>0?S.money+v:Math.max(Math.min(S.money,0),S.money+v);out.push('金钱'+sign(v));continue;}
  if(k==='progress'&&v>0)v=gainProg(v);
  if(k==='mood'&&v<0&&isEvent)v=Math.round(v*resFactor());
  if(v>0&&k!=='progress'&&k!=='envy'&&S.a[k]>70)v=v/2;
  const old=S.a[k];S.a[k]=clamp(old+v);
  out.push(LBL[k]+sign(Math.round((S.a[k]-old)*10)/10));
 }
 return out.join('，');
}

function paperProb(p){const base=p.fix!=null?p.fix:PAPER[p.lv].ps[0]+(p.acc||0);return Math.min(100,base+(p.bonus||0)+Math.floor(S.a.luck/10));}
function resolvePaper(p){
 const pr=paperProb(p);p.fix=null;p.bonus=0;
 if(Math.random()*100<pr){
  p.status='accepted';
  if(p.collab){S.a.mood=clamp(S.a.mood+3);return '合作的论文《'+esc(p.title)+'》（'+p.lv+' 档，你是'+roleName(p)+'）被接收了！心情+3';}
  const c=PAPER[p.lv];
  S.a.trust=clamp(S.a.trust+c.trust);S.a.envy=clamp(S.a.envy+c.envy);
  return '论文 #'+p.id+'（'+p.lv+' 档）被接收了！导师信任+'+c.trust+'，同辈忮忌+'+c.envy;
 }
 if(p.collab){p.rej++;p.due=S.month+2;p.fix=Math.min(100,pr+15);return '合作的论文《'+esc(p.title)+'》被拒了，同门说改一改两个月后再投。';}
 // 没中：按档次的比例分成小修、大修、拒稿
 const mx=PAPER[p.lv].mix,r=Math.random()*(mx[0]+mx[1]+mx[2]);p.rej++;
 if(r<mx[0]){p.status='doing';p.stage=NS-1;p.acc=(p.acc||0)+30;S.a.res=clamp(S.a.res-1);
  return '论文 #'+p.id+'（'+p.lv+' 档）审稿意见：<b>小修</b>。退回「写作」阶段，改完再投，下次接收率+30%。心态-1';}
 if(r<mx[0]+mx[1]){p.status='doing';p.stage=NS-2;p.acc=(p.acc||0)+15;S.a.res=clamp(S.a.res-3);
  return '论文 #'+p.id+'（'+p.lv+' 档）审稿意见：<b>大修</b>。退回「实验」阶段，补完实验再投，下次接收率+15%。心态-3';}
 p.status='rejected';p.acc=(p.acc||0)+15;S.a.res=clamp(S.a.res-5);
 return '论文 #'+p.id+'（'+p.lv+' 档）被<b>拒稿</b>，心态-5。可以退回「算法」阶段重做（下次接收率+15%）'+(p.lv==='C'?'。':'，也可以降档转投。');
}

 h+='<div class="card"><div class="top"><span class="who"><b>'+esc(S.name)+'</b> <span class="tag mid">'+stu.tag+'</span></span><button class="mini" onclick="G.modal(\'me\')">详情</button></div>'
  +attrsHtml(['health','mood'],null,true)
  +'<div class="chips">'+['res','hair','rel','scheme','luck'].map(k=>'<span class="chip">'+LBL[k]+' <b>'+Math.floor(S.a[k])+'</b></span>').join('')+'</div></div>';
 h+='<div class="tiles3">'+['ability','trust','envy'].map(k=>'<div class="stat'+(k==='envy'?' bad':'')+'"><span>'+LBL[k]+'</span><b>'+Math.floor(S.a[k])+'</b><i class="bar"><u style="width:'+S.a[k]+'%"></u></i></div>').join('')+'</div>';
 h+='<div class="card">'+boardHtml()+'</div>';
 h+='<div class="dock"><nav class="nav"><button'+(S.a.progress>=100?' class="go"':'')+' onclick="G.modal(\'paper\')">📄 论文<small>'+(S.a.progress>=100?'进展满了，快去用':'进展 '+S.a.progress)+'</small></button>'+'<button onclick="G.modal(\'confirmation\')">🎓 转正<small>'+S.confirmation.length+'/4 完成</small></button><button onclick="G.modal(\'log\')">📜 记录<small>最近的事</small></button><button onclick="G.modal(\'settings\')">⚙️ 设置<small>存档 · 图鉴</small></button></nav></div>';
 if(S.notices.length)h+=overlay('<h2>'+S.notices[0].t+'</h2><p class="story">'+S.notices[0].x+'</p><button class="primary" onclick="G.closeNotice()">知道了</button>');
 else if(S.ask&&S.ask.kind==='meet')h+=overlay('<h2>组会前夜</h2><p class="story">明天就是组会。这位导师要求每月至少做 '+needN()+' 件科研相关的事，你这个月只做了 '+(S.mres||0)+' 件。要不要熬夜赶一赶？（熬夜算一件）</p>'+optBtn(0,'G.ask(0)','熬夜赶进度','')+optBtn(1,'G.ask(1)','就这样去汇报',''));
 else if(S.step==='event'){const ev=EVENTS.find(e=>e.id===S.ev);
  h+=overlay('<div class="top"><span class="tag '+ev.tone+'">'+CATS[ev.c]+'事件</span><span class="muted">掷出 '+S.dice+' · 走到「'+TILE[ev.c]+'」格</span></div><h2>'+ev.n+'</h2><p class="story">'+ev.d+'</p><div class="col">'
   +ev.o.map((o,i)=>{const lock=o.req&&!o.req(S);const dis=lock||!canPay(o.e);const p=effParts(o.e);
    return optBtn(i,'G.opt('+i+')',o.t,o.reqT||'',dis,p.cost+(p.cost&&!canPay(o.e)?'（钱不够）':''));}).join('')+'</div>');}
 else if(S.modal==='daily'&&S.step==='daily'){const n=slots();const cost=pickCost(S.pick);
  h+=overlayC('<div class="top"><h2>'+dateStr(S.month)+'的活动</h2><button class="mini" onclick="G.modal(null)">关闭</button></div><p class="muted">这个月要排 '+n+' 件事，每件事每月只能做一次。默认保留上个月的选择，点一下取消，再点别的换掉。</p>'
   +['科研','社交','休养'].map(g=>'<h3 class="sub">'+g+'</h3><div class="grid2">'
    +DAILY.filter(d=>d.g===g).map(d=>{const on=S.pick.indexOf(d.k)>=0;const p=effParts(dailyEff(d));
     const dis=!on&&(S.pick.length>=n||(S.cnt[d.k]||0)>=1||(d.e.money<0&&cost-d.e.money>S.money));
     return '<button class="'+(on?'sel':'')+'" onclick="G.pick(\''+d.k+'\')"'+(dis?' disabled':'')+'>'+d.n+(p.cost?'<small class="cost">'+p.cost+'</small>':'')+'<small>'+p.eff+'</small></button>';}).join('')+'</div>').join('')
   +'<h3 class="sub">其他</h3><button onclick="G.modal(\'transfer\')">申请转组<small>占掉一件事 · 健康-10 心情-10 · 成功率约 '+tp+'%</small></button>'
   +'<div class="gobar"><span class="muted">已选 '+S.pick.length+'/'+n+(cost?' · 共花费 A$'+cost:'')+'</span><button class="primary" onclick="G.go()"'+(S.pick.length===n&&cost<=Math.max(0,S.money)?'':' disabled')+'>'+(cost>Math.max(0,S.money)?'钱不够，先取消几项花钱的':'就这么安排')+'</button></div>');}
 else if(S.modal==='me')h+=overlayC('<div class="top"><h2>'+esc(S.name)+'</h2><button class="mini" onclick="G.modal(null)">关闭</button></div>'+attrsHtml(['health','mood','res','hair','rel','scheme','luck'],null,true)
   +'<h3 class="sub">科研与组内</h3>'+attrsHtml(['ability','progress','trust','envy'],null,true)
   +'<ul class="muted"><li>健康和心情首次低于 50、首次低于 30 时各提醒一次，每局只提醒一次。怎么调整由你自己安排。</li><li>健康归零会住院，心情归零会休学。</li><li>心情或健康低于 30 时，每次获得的科研进展减半。</li><li>除科研进展和同辈忮忌外，任何属性超过 70 后加分减半。</li><li>心态越低，坏事件扣的心情越多。</li><li>科研能力每 20 点，每次多得 1 点科研进展。</li><li>人品提高论文接收率和转组成功率。</li><li>城府到 30 可以解锁更好的应对；同辈忮忌越高越容易被同门坑。</li></ul>');
 else if(S.modal==='confirmation')h+=overlayC(confirmationHtml());
 else if(S.modal==='paper')h+=overlayC(paperHtml());
 else if(S.modal==='title'&&S.draft)h+=overlayC('<h2>给论文起个标题</h2><p class="muted">目标 '+S.draft.lv+' 档，定题消耗科研进展 '+PAPER[S.draft.lv].cost+'。标题会写进博一结算。</p><div class="namebar"><input type="text" id="pt" maxlength="40" aria-label="论文标题" value="'+esc(S.draft.title)+'"><button class="mini" onclick="G.retitle()">换一个</button></div><div class="actions"><button class="big" onclick="G.modal(\'paper\')">返回</button><button class="big roll" onclick="G.okPaper()">就叫这个</button></div>');
 else if(S.modal==='album')h+=overlayC(albumHtml());
 else if(S.modal==='settings')h+=overlayC('<div class="top"><h2>设置</h2><button class="mini" onclick="G.modal(null)">关闭</button></div><p class="story">进度会自动保存在这台设备的浏览器里，下次打开可以接着玩。图鉴、成就和历史记录跨局保留。</p><button onclick="G.modal(\'album\')">查看图鉴</button><button onclick="G.modal(\'quit\')">放弃这一局，重新入学<small>当前进度会丢失，图鉴和成就不受影响</small></button>');
 else if(S.modal==='quit')h+=overlayC('<h2>确定重新入学？</h2><p class="story">这一局的进度会清空，不会记入历史记录。</p><div class="actions"><button class="big" onclick="G.modal(\'settings\')">再想想</button><button class="big roll" onclick="G.restart()">确定</button></div>');
 else if(S.modal==='log')h+=overlayC('<div class="top"><h2>最近发生的事</h2><button class="mini" onclick="G.modal(null)">关闭</button></div><div class="log">'+(S.log.slice().reverse().map(x=>'<span>'+x+'</span>').join('')||'<span>还什么都没发生。</span>')+'</div>');
 else if(S.modal==='transfer'&&S.step==='daily')h+=overlayC('<h2>申请转组</h2><p class="story">占用本月的一件日常，消耗健康 10、心情 10。成功后换导师，科研能力、人品、人缘、城府保留；<span class="hl">科研进展、论文和转正准备都要重来。</span>失败则白白消耗。</p><div class="actions"><button class="big" onclick="G.modal(\'daily\')">再想想</button><button class="big roll" onclick="G.transfer()">确定申请</button></div>');
 return h;
}
function view(){let h=view0();if(S.screen!=='main'&&S.modal==='album')h+=overlayC(albumHtml());return h;}
function view0(){
 if(S.screen==='welcome'){const s=load();const has=s&&s.screen!=='welcome'&&s.screen!=='end';
  return '<div class="card"><p class="muted">墨尔本 · 博一</p><h1>澳洲 PhD <span class="hl">模拟器</span></h1><p>Offer 到手了。你有 12 个月攒出一份经得住提问的研究计划，还得付房租。</p><ul><li>每月排四周活动，月底开组会，再掷骰子碰事件。</li><li>科研进展可以拿来写论文，也可以留给 Confirmation（博士转正）。</li><li>第 12 个月见 Panel。选「转正」可以查看材料和通过条件。</li></ul><p class="muted">金额与考核机制均为游戏设定。改编自 <a href="https://github.com/YunqingGe/grad-sim">YunqingGe 的读研模拟器</a>。</p>'
   +(has?'<button class="primary" onclick="G.resume()">继续上次的进度</button><button class="ghost" onclick="G.start()">重新入学</button>':'<button class="primary" onclick="G.start()">报到入学</button>')+'<button class="ghost" onclick="G.modal(\'album\')">图鉴：结局、成就、历史</button></div>';}
 if(S.screen==='drawStudent'){const t=S.stu>=0?STUDENTS[S.stu]:null;
  let h='<div class="top strip"><b>抽签问出身</b><span class="muted">八种学生，全凭手气</span></div><div class="namebar"><input type="text" id="nm" maxlength="12" placeholder="给自己起个名字" aria-label="名字" value="'+esc(S.name)+'"><button class="mini" onclick="G.rename()">换一个</button></div>';
  if(!t)return h+'<div class="card"><p>签筒摇一摇，看看你是哪种研究生。</p><button class="primary" onclick="G.drawStu()">抽签</button></div>';
  return h+'<div class="card"><div class="top"><h2>'+t.tag+'</h2><span class="tag mid">准备金 A$'+t.a.wealth*20+'</span></div><p class="story">'+t.desc+'</p><div class="chips">'+(t.note?'<span class="chip '+t.noteCls+'">'+t.note+'</span>':'')+t.hi.map(k=>'<span class="chip up">'+LBL[k]+'高</span>').join('')+t.lo.map(k=>'<span class="chip down">'+LBL[k]+'低</span>').join('')+'</div>'
   +attrsHtml(['health','mood','res','hair','rel','scheme','luck','ability','wealth'],t.a,true)+'</div>'
   +'<div class="actions"><button class="big" onclick="G.drawStu()">不满意，重抽</button><button class="big roll" onclick="G.okStu()">就是我了</button></div>';}
 if(S.screen==='drawMentor'){const m=S.men>=0?MENTORS[S.men]:null;
  let h='<div class="top strip"><b>抽导师</b><span class="muted">'+esc(S.name)+' · 准备金 A$'+S.money+'</span></div>';
  if(!m)return h+'<div class="card"><p>四种导师，脾气、指导风格和奖学金各不相同。抽到不满意的可以重抽。</p><button class="primary" onclick="G.drawMen()">抽签</button></div>';
  return h+'<div class="card"><h2>'+m.name+'</h2><p class="story">'+m.desc+'</p><div class="chips"><span class="chip">奖学金 A$'+m.stipend+'/月</span>'+m.tags.map(x=>'<span class="chip">'+x+'</span>').join('')+'</div></div>'
   +'<div class="actions"><button class="big" onclick="G.drawMen()">不满意，重抽</button><button class="big roll" onclick="G.okMen()">确认导师</button></div>';}
 if(QS[S.screen]&&S.qres)return '<div class="top strip"><b>报到</b><span class="muted">现有 A$'+S.money+'</span></div><div class="card"><h2>'+S.qres.t+'</h2><p class="story">'+S.qres.x+'</p><button class="primary" onclick="G.qnext()">继续</button></div>';
 if(QS[S.screen]){const q=QS[S.screen];const n={q1:'第一问',q2:'第二问'}[S.screen];
  return '<div class="top strip"><b>报到</b><span class="muted">'+n+' · 现有 A$'+S.money+'</span></div><div class="card"><h2>'+q.t+'</h2><div class="col">'+q.o.map((o,i)=>{const p=effParts(o.e);return optBtn(i,"G.answer('"+S.screen+"',"+i+")",o.t,'',!canPay(o.e),p.cost);}).join('')+'</div></div>';}
 if(S.screen==='main')return mainHtml();
 if(S.screen==='review'){
  const last=S.notices[S.notices.length-1];
  return '<div class="card"><p class="muted">博一 · 第 12 个月</p><h2>Confirmation Panel</h2><p class="story">评委到了。你的材料已经放在桌上。</p>'
   +confirmationChecklist()+(last?'<p class="muted">最后一件事 · '+last.t+'</p><p>'+last.x+'</p>':'')
   +'<button class="primary" onclick="G.confirm()">进会议室</button></div>';
 }
 if(S.screen==='end'){
  return '<div class="card end"><p class="muted">结局 · '+dateStr(S.month)+'</p><h2><span class="hl">'+S.ending.t+'</span></h2><p>'+S.ending.x+'</p></div>'
   +'<div class="card"><h3>'+esc(S.name)+'的博一结算</h3><p class="muted">导师 · '+S.mentor.name+'</p>'+yearPage()+'</div>'
   +'<div class="card"><h3>本局成就 '+(S.runAch||[]).length+' 个'+(S.newEnd?' · 新结局':'')+'</h3><div class="chips">'+((S.runAch||[]).map(id=>{const a=ACH.find(x=>x.id===id);return '<span class="chip '+((S.newAch||[]).indexOf(id)>=0?'up':'')+'" title="'+a.d+'">'+a.n+((S.newAch||[]).indexOf(id)>=0?' · 新':'')+'</span>';}).join('')||'<span class="muted">这一局没有解锁成就。</span>')+'</div><button class="ghost" onclick="G.modal(\'album\')">查看图鉴</button></div><button class="primary" onclick="G.restart()">再读一次 PhD</button>';}
 return '';
}
let lastKey='';
function render(){if(typeof document==='undefined')return;const app=document.getElementById('app');
 const oc=app.querySelector('.overlay .card');const st=oc?oc.scrollTop:0;
 const key=[S.screen,S.modal,S.notices.length,S.ask?.kind,S.step].join('|');
 app.innerHTML=view();
 if(key===lastKey){const nc=app.querySelector('.overlay .card');if(nc)nc.scrollTop=st;}
 lastKey=key;}
G._={get S(){return S;},get M(){return M;},ACH:ACH,NS:NS,BOARD:BOARD,EVENTS:EVENTS,DAILY:DAILY,PAPER:PAPER,canPay:canPay,view:view};
(typeof window!=='undefined'?window:globalThis).G=G;
render();
})();
